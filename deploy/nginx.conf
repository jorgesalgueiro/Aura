server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # A app é uma só página: qualquer caminho cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index e o service worker mudam com cada versão: nunca guardar.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # O .webmanifest não consta do mime.types do nginx.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Estes podem ser cacheados com força: quem manda é a versão do SW.
    location ~* \.(?:css|js|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
